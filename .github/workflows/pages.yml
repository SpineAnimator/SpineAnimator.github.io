name: Deploy sanitized Spine Animator site
on:
  push:
    branches: [main]
    paths:
      - Spine-Mask-Tool/**
      - index.html
      - app.js
      - README.md
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'SpineAnimator/SpineAnimator.github.io' && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject unexpected sources and prepare frontend-only artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --input-type=module --check < Spine-Mask-Tool/core.js
          node --input-type=module --check < Spine-Mask-Tool/app.js
          node --input-type=module --check < Spine-Mask-Tool/linux-api.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source=fs.readFileSync('Spine-Mask-Tool/core.js','utf8');
          const {imageMask,availableRegions,exportJson,exportLocalEditorMask} =
            await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          const w=112,h=56,rgba=new Uint8ClampedArray(w*h*4);
          function pixel(x,y){rgba[(y*w+x)*4+3]=255;}
          for(let y=5;y<=49;y++)for(let x=6;x<=39;x++)
            if(!((x>14&&x<33&&y>11&&y<24)||(x>14&&x<33&&y>30&&y<44)))pixel(x,y);
          for(let y=7;y<=47;y++)for(let x=55;x<=96;x++)
            if(!(x>63&&x<89&&y>16&&y<39))pixel(x,y);
          for(let y=1;y<=3;y++)for(let x=106;x<=109;x++)pixel(x,y);
          const r=imageMask({width:w,height:h,data:rgba},{bridgeWidth:2,minArea:2});
          assert.equal(r.stats.shapes,3);
          assert.equal(r.stats.bridges,2);
          assert.equal(r.stats.slits,3);
          assert.ok(r.stats.mobileQualityPassed,'legacy mask must remain valid');
          assert.ok(r.stats.vertices<=240,'30-skeleton budget exceeded');
          assert.ok(r.stats.totalSceneClippingVertices<=7200,'aggregate 30-skeleton budget exceeded');
          const original={skeleton:{spine:'4.3.26'},bones:[{name:'root'}],
            slots:[{name:'image',bone:'root',attachment:'image'}],
            skins:[{name:'default',attachments:{image:{
              image:{type:'region',path:'image',width:w,height:h}}}}],
            animations:{idle:{}}};
          const saved=JSON.stringify(original);
          const out=exportJson(original,availableRegions(original)[0],r.points,w,h);
          assert.equal(JSON.stringify(original),saved);
          assert.equal(out.json.slots[0].attachment,'clip');
          assert.equal(out.json.slots[1].name,'image');
          assert.equal(out.json.skins[0].attachments[out.slot].clip.end,'image');
          assert.equal(out.json.skins[0].attachments[out.slot].clip.vertexCount,r.stats.vertices);
          assert.ok(out.json.animations.idle);
          const once=JSON.stringify(out.json);
          const rerun=exportJson(out.json,availableRegions(out.json)[0],r.points,w,h);
          assert.equal(rerun.json.slots.length,2,'regenerating mask duplicated a slot');
          assert.equal(rerun.slot,out.slot,'regenerating mask changed the clipping slot');
          assert.ok(rerun.json.animations.idle,'regeneration removed animation');
          const localRerun=exportLocalEditorMask(out.json,availableRegions(out.json)[0],r.points,w,h);
          assert.equal(localRerun.json.slots.length,2,'native regeneration duplicated clipping');
          assert.equal(localRerun.clippingSlot,out.slot);
          assert.equal(JSON.stringify(out.json),once,'regeneration mutated input JSON');
          console.log('MASK_TOOL_IDEMPOTENT_CLIP_PASS');
          const legacy=JSON.parse(JSON.stringify(out.json));
          legacy.slots.push({name:'hotspot',bone:'root',attachment:'hotspot'});
          legacy.skins[0].attachments.hotspot={hotspot:{
            type:'region',path:'hotspot',width:16,height:16
          }};
          legacy.skins[0].attachments[out.slot].clip.end='hotspot';
          legacy.animations.idle.slots={hotspot:{attachment:[{name:'hotspot'}]}};
          const legacySnapshot=JSON.stringify(legacy);
          const corrected=exportLocalEditorMask(
            legacy,availableRegions(legacy).find(x=>x.slot==='image'),r.points,w,h
          );
          assert.equal(corrected.json.slots.length,3,
            'legacy clip repair added extra slots');
          assert.equal(corrected.json.skins[0].attachments[out.slot].clip.end,'image',
            'legacy clipping still captures hotspot');
          assert.ok(corrected.json.skins[0].attachments.hotspot.hotspot,
            'independent hotspot attachment was lost');
          assert.deepEqual(corrected.json.animations.idle.slots.hotspot,
            legacy.animations.idle.slots.hotspot,
            'artist hotspot animation keys changed');
          assert.equal(JSON.stringify(legacy),legacySnapshot,'source was mutated');
          console.log('MASK_TOOL_LEGACY_HOTSPOT_CLIP_REPAIR_PASS');
          const html=fs.readFileSync('Spine-Mask-Tool/index.html','utf8');
          const app=fs.readFileSync('Spine-Mask-Tool/app.js','utf8');
          assert.ok(html.includes('id="image-source"'), 'missing image picker');
          assert.ok(app.includes('Binary .spine needs conversion'), 'binary import must fail closed');
          console.log('MASK_TOOL_GEOMETRY_AND_EXPORT_PASS', r.stats);
          // Synthetic gold logo-like faces and brown extrusion: exactly one
          // clip, dark brown excluded, original visible alpha kept, holes kept.
          const sw=118,sh=68,gold=new Uint8ClampedArray(sw*sh*4);
          function shade(x,y,red,green,blue){
            const p=(y*sw+x)*4;gold[p]=red;gold[p+1]=green;gold[p+2]=blue;gold[p+3]=255;
          }
          for(let y=8;y<57;y++)for(let x=5;x<53;x++)shade(x,y,86,31,6);
          for(let y=12;y<50;y++)for(let x=9;x<48;x++)shade(x,y,255,177,18);
          for(let y=9;y<56;y++)for(let x=65;x<113;x++)shade(x,y,93,34,5);
          for(let y=14;y<48;y++)for(let x=69;x<108;x++)
            if(!(x>81&&x<95&&y>23&&y<38))shade(x,y,249,190,32);
          const faces=imageMask({width:sw,height:sh,data:gold},{highlightFaces:true});
          const all=imageMask({width:sw,height:sh,data:gold},{highlightFaces:false});
          const goldPixel=(x,y)=>y*sw+x;
          assert.equal(faces.stats.highlightApplied,true,'automatic light segmentation not applied');
          assert.equal(faces.stats.concurrentSkeletons,30);
          assert.ok(faces.stats.mobileQualityPassed,'highlight mobile quality gate failed');
          assert.ok(faces.stats.vertices<=240);
          assert.ok(faces.stats.totalSceneClippingVertices<=7200);
          assert.ok(faces.stats.darkLeakPercent<=3);
          assert.ok(faces.stats.missingLightPercent<=7);
          assert.equal(faces.stats.innerHolesPreserved,true);
          assert.equal(faces.visibleAlpha[goldPixel(5,9)],0,'dark shadow leaked');
          assert.equal(faces.visibleAlpha[goldPixel(10,15)],255,'bright face missing');
          assert.equal(faces.visibleAlpha[goldPixel(84,28)],0,'inner O opening lost');
          assert.equal(faces.visibleAlpha[goldPixel(58,20)],0,'routing bridge became visible');
          assert.equal(all.visibleAlpha[goldPixel(5,9)],255,'OFF mode must retain full silhouette');
          assert.ok(faces.points.length>=4,'missing single clipping polygon');
          assert.ok(html.includes('id="highlight-edges"'),'agent checkbox absent');
          assert.ok(!html.includes('type="range"'),'manual slider still published');
          assert.ok(app.includes('SpineMaskAgentControl'),'agent API absent');
          console.log('MASK_TOOL_AUTO_LIGHT_FACE_PASS',faces.stats);

          NODE
          git ls-files --error-unmatch .nojekyll README.md app.js index.html .github/workflows/pages.yml Spine-Mask-Tool/core.js Spine-Mask-Tool/app.js Spine-Mask-Tool/index.html Spine-Mask-Tool/linux-api.js >/dev/null
          test "$(git ls-files | wc -l)" -eq 9 || { echo "::error::Unsafe extra file in public Pages repository"; exit 1; }
          test -s index.html && test -s app.js
          grep -Fq '<span class="version">v.1.4.2</span>' index.html || { echo "::error::Expected restored website v1.4.2"; exit 1; }
          grep -Fq 'src="./app.js"' index.html || { echo "::error::Missing audited app.js reference"; exit 1; }
          if grep -nEi 'github_pat_|ghp_[A-Za-z0-9]{20}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ACCESS_TOKEN|SPINE_LICENSE_KEY|CLOUDFLARE_API_TOKEN' index.html app.js Spine-Mask-Tool/index.html Spine-Mask-Tool/app.js Spine-Mask-Tool/core.js Spine-Mask-Tool/linux-api.js; then
            echo "::error::Potential private credentials in public Pages"; exit 1
          fi
          mkdir -p dist/Spine-Mask-Tool
          cp index.html app.js .nojekyll dist/
          cp Spine-Mask-Tool/index.html Spine-Mask-Tool/app.js Spine-Mask-Tool/core.js Spine-Mask-Tool/linux-api.js dist/Spine-Mask-Tool/
          test "$(find dist -type f | wc -l)" -eq 7
          echo 'PUBLIC_PAGES_ALLOWLIST_PASS'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published HTML and JavaScript over HTTPS
        shell: bash
        env:
          PUBLIC_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_PAGE_URL" || { echo '::error::Deployment returned no public URL'; exit 1; }
          case "$PUBLIC_PAGE_URL" in
            https://spineanimator.github.io/|https://spineanimator.github.io) ;;
            *) echo "::error::Unexpected Pages origin: $PUBLIC_PAGE_URL"; exit 1 ;;
          esac
          # Pages CDN may still serve an older deployment immediately after
          # deploy-pages reports success. Retry CONTENT verification, not only
          # HTTP failures, and print a useful diagnostic on final failure.
          verify_live_content() {
            curl -fLsS --max-time 15 \
              "https://spineanimator.github.io/?check=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/published-index.html" || return 1
            grep -Fq 'SPINE ANIMATOR' "$RUNNER_TEMP/published-index.html" || return 1
            grep -Fq 'src="./app.js"' "$RUNNER_TEMP/published-index.html" || return 1
            grep -Fq '<span class="version">v.1.4.2</span>' "$RUNNER_TEMP/published-index.html" || return 1
            curl -fLsS --max-time 15 \
              "https://spineanimator.github.io/app.js?check=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/published-app.js" || return 1
            node --check "$RUNNER_TEMP/published-app.js" || return 1
            grep -Fq 'Cloud animation in progress' "$RUNNER_TEMP/published-app.js" || return 1
            curl -fLsS --max-time 15 \
              "https://spineanimator.github.io/Spine-Mask-Tool/?check=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/mask-tool.html" || return 1
            grep -Fq '<main class="app-shell">' "$RUNNER_TEMP/mask-tool.html" || return 1
            grep -Fq 'id="quick-from-spine"' "$RUNNER_TEMP/mask-tool.html" || return 1
            grep -Fq 'id="do-all"' "$RUNNER_TEMP/mask-tool.html" || return 1
            grep -Fq 'id="quick-install-bridge"' "$RUNNER_TEMP/mask-tool.html" || return 1
            grep -Fq 'id="linux-result-link"' "$RUNNER_TEMP/mask-tool.html" || return 1
            for asset in app.js core.js linux-api.js; do
              curl -fLsS --max-time 15 \
                "https://spineanimator.github.io/Spine-Mask-Tool/$asset?check=$GITHUB_SHA" \
                -o "$RUNNER_TEMP/mask-$asset" || return 1
              node --input-type=module --check < "$RUNNER_TEMP/mask-$asset" || return 1
            done
            return 0
          }
          VERIFIED=0
          for attempt in $(seq 1 12); do
            if verify_live_content; then VERIFIED=1; break; fi
            echo "Pages public content has not converged (attempt $attempt/12)"
            sleep 5
          done
          if [ "$VERIFIED" != 1 ]; then
            echo "::error::Pages public content verification failed after propagation retries"
            echo "Published index bytes: $(wc -c < "$RUNNER_TEMP/published-index.html" 2>/dev/null || echo unavailable)"
            exit 1
          fi
          echo "LIVE_PAGES_HTML_AND_JS_PASS $PUBLIC_PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_SPINE_MASK_TOOL_PASS https://spineanimator.github.io/Spine-Mask-Tool/" >> "$GITHUB_STEP_SUMMARY"

      - name: Browser smoke — upload PNG, generate mask, select target, download JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mask-smoke"
          npm install --prefix "$RUNNER_TEMP/mask-smoke" --no-audit --no-fund --silent playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            "$RUNNER_TEMP/mask-smoke/node_modules/.bin/playwright" install chromium
          fi
          export CHROME_PATH
          cat > "$RUNNER_TEMP/mask-smoke/smoke.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import os from 'node:os';
          import path from 'node:path';
          import { chromium } from 'playwright';
          const opts={headless:true,args:['--no-sandbox','--disable-dev-shm-usage']};
          if(process.env.CHROME_PATH) opts.executablePath=process.env.CHROME_PATH;
          const browser=await chromium.launch(opts);
          const page=await browser.newPage({acceptDownloads:true});
          const pageErrors=[];
          page.on('pageerror',err=>pageErrors.push(err.message));
          const url='https://spineanimator.github.io/Spine-Mask-Tool/';
          try {
            const response=await page.goto(url,{waitUntil:'load',timeout:45000});
            assert.equal(response.status(),200,'Mask Tool page must return 200');
            await page.waitForFunction(()=>document.getElementById('status')?.textContent.includes('Open a Spine project'),{timeout:30000});
            assert.equal(await page.locator('#quick-from-spine').isVisible(),true,'Simple From Spine is hidden');
            assert.equal(await page.locator('#do-all').isVisible(),true,'Simple Make all is hidden');
            assert.equal(await page.locator('#quick-install-bridge').isVisible(),true,'Unconnected Simple installer missing');
            assert.equal(await page.locator('#linux-result-link').isHidden(),true);
            const simpleSurface=await page.evaluate(()=>{
              const hidden=['.chips','.fields','.control-panel','.file-zone','.preview-head',
                '.preview-meta','.actions','.status-line','.quick-bridge-status','.quick-hint','.version'];
              return {agentMode:document.body.classList.contains('agent-mode'),
                hidden:hidden.every(selector=>{
                  const e=document.querySelector(selector);
                  return !e||getComputedStyle(e).display==='none'||getComputedStyle(e).visibility==='hidden';
                }),
                text:document.body.innerText};
            });
            assert.equal(simpleSurface.agentMode,false,'Simple must be the default mode');
            assert.equal(simpleSurface.hidden,true,'Simple mode must hide explanatory and advanced text');
            assert.match(simpleSurface.text,/Spine Mask Tool/,'Logo missing');
            assert.match(simpleSurface.text,/Agents/,'Agent toggle must remain available');
            assert.match(simpleSurface.text,/Сделать маску/,'Main action button missing');
            assert.match(simpleSurface.text,/Install Bridge/,'Installer button missing');
            assert.doesNotMatch(simpleSurface.text,/Drop files|No image supplied|One clipping mask|Spine Editor Bridge/,
              'Simple mode must not show explanatory copy outside buttons and logo');
            await page.locator('#agent-toggle').click();
            await page.waitForFunction(()=>document.body.classList.contains('agent-mode'));
            assert.equal(await page.locator('#open-editor').isVisible(),true,'Agents UI should remain available');
            const ui=await page.evaluate(()=>{
              const main=document.querySelector('.app-shell');
              const panels=document.querySelector('.panels');
              const preview=document.querySelector('.preview-panel');
              const controls=document.querySelector('.control-panel');
              const css=getComputedStyle(document.body);
              return {
                checker:css.backgroundImage.includes('linear-gradient'),
                dark:css.backgroundColor==='rgb(26, 26, 26)',
                columns:getComputedStyle(panels).gridTemplateColumns.split(' ').length,
                order:preview.getBoundingClientRect().left<controls.getBoundingClientRect().left,
                square:getComputedStyle(document.querySelector('#generate')).borderRadius==='0px',
                shell:main!==null
              };
            });
            assert.deepEqual(ui,{checker:true,dark:true,columns:2,order:true,square:true,shell:true});
            console.log('MASK_TOOL_SPINE_RESIZE_LAYOUT_PASS');
            const png64=await page.evaluate(()=>{
              const c=document.createElement('canvas');c.width=112;c.height=56;
              const ctx=c.getContext('2d');
              ctx.clearRect(0,0,112,56);ctx.fillStyle='#ffb320';
              ctx.fillRect(6,5,34,45);ctx.clearRect(15,12,18,12);ctx.clearRect(15,31,18,13);
              ctx.fillRect(55,7,42,41);ctx.clearRect(64,17,25,22);
              ctx.fillRect(106,1,4,3);
              return c.toDataURL('image/png').split(',')[1];
            });
            const png=Buffer.from(png64,'base64');
            await page.locator('#files').setInputFiles([{name:'image.png',mimeType:'image/png',buffer:png}]);
            await page.waitForFunction(()=>document.getElementById('source-name')?.textContent.includes('image.png'));
            await page.locator('#generate').click();
            await page.waitForFunction(()=>document.getElementById('summary')?.textContent.startsWith('ONE CLIPPING MASK'),{timeout:30000});
            assert.equal(await page.locator('#download-json').isEnabled(),true);
            const [download]=await Promise.all([page.waitForEvent('download'),page.locator('#download-json').click()]);
            const out=path.join(os.tmpdir(),'mask-ui-test.json');
            await download.saveAs(out);
            const single=JSON.parse(fs.readFileSync(out,'utf8'));
            const newSlot=single.slots.find(s=>s.name.startsWith('auto_mask_'));
            assert.ok(newSlot);
            const clip=single.skins[0].attachments[newSlot.name].clip;
            assert.equal(clip.type,'clipping');assert.equal(clip.end,'image');
            assert.ok(clip.vertexCount>10);assert.equal(clip.vertices.length,clip.vertexCount*2);
            // No rendering may use the connector/slit pixels as visible coverage.
            const previewAlpha=await page.locator('#preview').evaluate(el=>{
              const c=el.getContext('2d'),rgba=c.getImageData(0,0,el.width,el.height).data;
              const pixel=(x,y)=>rgba[(y*el.width+x)*4+3];
              return {gap:pixel(48,28),bHole:pixel(20,17),oHole:pixel(76,28),
                b:pixel(10,10),o:pixel(60,10),dot:pixel(107,2)};
            });
            assert.equal(previewAlpha.gap,0,'Invisible bridge leaked into browser preview');
            assert.equal(previewAlpha.bHole,0,'B hole became opaque');
            assert.equal(previewAlpha.oHole,0,'O hole became opaque');
            assert.ok(previewAlpha.b>0&&previewAlpha.o>0&&previewAlpha.dot>0);
            assert.equal(await page.locator('#download-spine-zip').isEnabled(),true);
            console.log('MASK_TOOL_INVISIBLE_PREVIEW_PASS');
            assert.equal(await page.locator('#native-preview').isEnabled(),true);
            let submittedZip=null;
            const targetBase='https://spine-mask-native-gateway.vladyslavchaplygin.workers.dev';
            await page.route(targetBase+'/**',async route=>{
              const req=route.request(),u=new URL(req.url());
              console.log('MOCK_GATEWAY_CALL',req.method(),u.pathname);
              const cors={
                'Access-Control-Allow-Origin':'https://spineanimator.github.io',
                'Access-Control-Allow-Methods':'GET,POST,PUT,OPTIONS',
                'Access-Control-Allow-Headers':'authorization,content-type'
              };
              if(req.method()==='OPTIONS'){await route.fulfill({status:204,headers:cors});return;}
              if(u.pathname==='/v1/sessions'&&req.method()==='POST'){
                await route.fulfill({status:201,contentType:'application/json',headers:cors,
                  body:JSON.stringify({id:'00000000-0000-4000-8000-000000000001',uploadToken:'upload_secret',resultToken:'read_secret'})});return;
              }
              if(u.pathname.endsWith('/input')&&req.method()==='PUT'){
                submittedZip=req.postDataBuffer();
                await route.fulfill({status:202,contentType:'application/json',headers:cors,body:'{"status":"queued"}'});return;
              }
              if(u.pathname.endsWith('/result')&&req.method()==='GET'){
                await route.fulfill({status:200,contentType:'image/png',headers:cors,body:png});return;
              }
              await route.fulfill({status:404,headers:cors,body:'{}'});
            });
            assert.equal(await page.locator('#highlight-edges').isChecked(),true);
            assert.equal(await page.locator('input[type=range]').count(),0);
            const agent=await page.evaluate(()=>{
              const api=window.SpineMaskAgentControl;
              if(!api)return {ready:false};
              const before=api.getHighlightEdges();
              api.setHighlightEdges(false);
              const off=api.getHighlightEdges();
              api.setHighlightEdges(true);
              const on=api.getHighlightEdges();
              return {ready:true,before,off,on};
            });
            assert.deepEqual(agent,{ready:true,before:true,off:false,on:true});
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled,{timeout:30000});
            console.log('MASK_TOOL_AGENT_CHECKBOX_PASS');
            await page.locator('#native-preview').click();
            try {
              await page.waitForFunction(()=>document.getElementById('native-result')?.hidden===false,null,{timeout:20000});
            } catch (err) {
              console.log('NATIVE_BROWSER_DEBUG',{
                message:await page.locator('#native-status').textContent(),
                uploadedBytes:submittedZip?.length||0,errors:pageErrors
              });
              throw err;
            }
            assert.ok(submittedZip,'native upload is missing');
            function entryAt(buf,offset){
              assert.equal(buf.readUInt32LE(offset),0x04034b50,'invalid ZIP local header');
              const size=buf.readUInt32LE(offset+18),nameLen=buf.readUInt16LE(offset+26),
                extraLen=buf.readUInt16LE(offset+28),name=buf.subarray(offset+30,offset+30+nameLen).toString();
              const start=offset+30+nameLen+extraLen;
              return {name,content:buf.subarray(start,start+size),next:start+size};
            }
            const one=entryAt(submittedZip,0),two=entryAt(submittedZip,one.next);
            assert.equal(one.name,'scene.json');
            assert.equal(two.name,'images/fill.png');
            assert.ok(two.content.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));
            const fillAlpha=await page.evaluate(async encoded=>{
              const raw=atob(encoded),input=new Uint8Array(raw.length);
              for(let i=0;i<raw.length;i++)input[i]=raw.charCodeAt(i);
              const bitmap=await createImageBitmap(new Blob([input],{type:'image/png'}));
              const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;
              const context=c.getContext('2d');context.drawImage(bitmap,0,0);
              const data=context.getImageData(0,0,c.width,c.height).data;
              const alpha=(x,y)=>data[(y*c.width+x)*4+3];
              return {gap:alpha(48,28),bHole:alpha(20,17),oHole:alpha(76,28),
                left:alpha(10,10),right:alpha(60,10)};
            },two.content.toString('base64'));
            assert.equal(fillAlpha.gap,0,'Uploaded Spine texture contains bridge pixels');
            assert.equal(fillAlpha.bHole,0);
            assert.equal(fillAlpha.oHole,0);
            assert.ok(fillAlpha.left>0&&fillAlpha.right>0,'Both visible letters must survive');
            console.log('MASK_TOOL_INVISIBLE_NATIVE_TEXTURE_PASS');

            const [packageDownload]=await Promise.all([
