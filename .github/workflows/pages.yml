              return {count:x.commits,sourceUnmodified:x.original.includes('"idle"'),
                slots:x.result.slots.map(s=>s.name),animations:!!x.result.animations?.idle,
                clip:clips[0],clipCount:clips.length,clipBone:maskSlot?.bone,
