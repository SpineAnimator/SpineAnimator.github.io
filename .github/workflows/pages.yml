name: Deploy sanitized Spine Animator site
on:
  push:
    branches: [main]
    paths:
      - Spine-Mask-Tool/**
      - index.html
      - app.js
      - README.md
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'SpineAnimator/SpineAnimator.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject unexpected sources and prepare frontend-only artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --input-type=module --check < Spine-Mask-Tool/core.js
          node --input-type=module --check < Spine-Mask-Tool/app.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source=fs.readFileSync('Spine-Mask-Tool/core.js','utf8');
          const {imageMask,availableRegions,exportJson} =
            await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          const w=112,h=56,rgba=new Uint8ClampedArray(w*h*4);
          function pixel(x,y){rgba[(y*w+x)*4+3]=255;}
          for(let y=5;y<=49;y++)for(let x=6;x<=39;x++)
            if(!((x>14&&x<33&&y>11&&y<24)||(x>14&&x<33&&y>30&&y<44)))pixel(x,y);
          for(let y=7;y<=47;y++)for(let x=55;x<=96;x++)
            if(!(x>63&&x<89&&y>16&&y<39))pixel(x,y);
          for(let y=1;y<=3;y++)for(let x=106;x<=109;x++)pixel(x,y);
          const r=imageMask({width:w,height:h,data:rgba},{bridgeWidth:2,minArea:2});
          assert.equal(r.stats.shapes,3);
          assert.equal(r.stats.bridges,2);
          assert.equal(r.stats.slits,3);
          const original={skeleton:{spine:'4.3.26'},bones:[{name:'root'}],
            slots:[{name:'image',bone:'root',attachment:'image'}],
            skins:[{name:'default',attachments:{image:{
              image:{type:'region',path:'image',width:w,height:h}}}}],
            animations:{idle:{}}};
          const saved=JSON.stringify(original);
          const out=exportJson(original,availableRegions(original)[0],r.points,w,h);
          assert.equal(JSON.stringify(original),saved);
          assert.equal(out.json.slots[0].attachment,'clip');
          assert.equal(out.json.slots[1].name,'image');
          assert.equal(out.json.skins[0].attachments[out.slot].clip.end,'image');
          assert.equal(out.json.skins[0].attachments[out.slot].clip.vertexCount,r.stats.vertices);
          assert.ok(out.json.animations.idle);
          const html=fs.readFileSync('Spine-Mask-Tool/index.html','utf8');
          const app=fs.readFileSync('Spine-Mask-Tool/app.js','utf8');
          assert.ok(html.includes('id="image-source"'), 'missing image picker');
          assert.ok(app.includes('Binary .spine needs conversion'), 'binary import must fail closed');
          console.log('MASK_TOOL_GEOMETRY_AND_EXPORT_PASS', r.stats);
          NODE
          git ls-files --error-unmatch .nojekyll README.md app.js index.html .github/workflows/pages.yml Spine-Mask-Tool/core.js Spine-Mask-Tool/app.js Spine-Mask-Tool/index.html >/dev/null
          test "$(git ls-files | wc -l)" -eq 8 || { echo "::error::Unsafe extra file in public Pages repository"; exit 1; }
          test -s index.html && test -s app.js
          grep -Fq '<span class="version">v.1.4.2</span>' index.html || { echo "::error::Expected restored website v1.4.2"; exit 1; }
          grep -Fq 'src="./app.js"' index.html || { echo "::error::Missing audited app.js reference"; exit 1; }
          if grep -nEi 'github_pat_|ghp_[A-Za-z0-9]{20}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ACCESS_TOKEN|SPINE_LICENSE_KEY|CLOUDFLARE_API_TOKEN' index.html app.js Spine-Mask-Tool/index.html Spine-Mask-Tool/app.js Spine-Mask-Tool/core.js; then
            echo "::error::Potential private credentials in public Pages"; exit 1
          fi
          mkdir -p dist/Spine-Mask-Tool
          cp index.html app.js .nojekyll dist/
          cp Spine-Mask-Tool/index.html Spine-Mask-Tool/app.js Spine-Mask-Tool/core.js dist/Spine-Mask-Tool/
          test "$(find dist -type f | wc -l)" -eq 6
          echo 'PUBLIC_PAGES_ALLOWLIST_PASS'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published HTML and JavaScript over HTTPS
        shell: bash
        env:
          PUBLIC_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_PAGE_URL" || { echo '::error::Deployment returned no public URL'; exit 1; }
          case "$PUBLIC_PAGE_URL" in
            https://spineanimator.github.io/|https://spineanimator.github.io) ;;
            *) echo "::error::Unexpected Pages origin: $PUBLIC_PAGE_URL"; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 4 --retry-all-errors --max-time 15 \
            "https://spineanimator.github.io/" -o "$RUNNER_TEMP/published-index.html"
          grep -Fq 'SPINE ANIMATOR' "$RUNNER_TEMP/published-index.html"
          grep -Fq 'src="./app.js"' "$RUNNER_TEMP/published-index.html"
          grep -Fq '<span class="version">v.1.4.2</span>' "$RUNNER_TEMP/published-index.html"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 4 --retry-all-errors --max-time 15 \
            "https://spineanimator.github.io/app.js" -o "$RUNNER_TEMP/published-app.js"
          node --check "$RUNNER_TEMP/published-app.js"
          grep -Fq 'Cloud animation in progress' "$RUNNER_TEMP/published-app.js"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 4 --retry-all-errors --max-time 15 \
            "https://spineanimator.github.io/Spine-Mask-Tool/" -o "$RUNNER_TEMP/mask-tool.html"
          grep -Fq 'One image. One mask.' "$RUNNER_TEMP/mask-tool.html"
          for asset in app.js core.js; do
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 4 --retry-all-errors --max-time 15 \
              "https://spineanimator.github.io/Spine-Mask-Tool/$asset" -o "$RUNNER_TEMP/mask-$asset"
            node --input-type=module --check < "$RUNNER_TEMP/mask-$asset"
          done
          echo "LIVE_PAGES_HTML_AND_JS_PASS $PUBLIC_PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_SPINE_MASK_TOOL_PASS https://spineanimator.github.io/Spine-Mask-Tool/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify cloud animation API preflights
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            "https://spine-studio.spine-animator-f8692224.workers.dev/api/plan" \
            "https://spine-generator.spine-animator-f8692224.workers.dev/api/build"; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 15 \
              --output /dev/null --dump-header "$headers" \
              --request OPTIONS \
              --header 'Origin: https://spineanimator.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --write-out '%{http_code}' "$endpoint")"
            if [[ "$status" != 200 && "$status" != 204 ]]; then
              echo "::error::API preflight HTTP $status for $endpoint"
              exit 1
            fi
            if ! grep -Fiq 'access-control-allow-origin: https://spineanimator.github.io' "$headers"; then
              echo "::error::Missing canonical Origin permission for $endpoint"
              exit 1
            fi
            echo "API_PREFLIGHT_PASS $endpoint" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$headers"
          done
