name: Deploy sanitized Spine Animator site
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - README.md
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'SpineAnimator/SpineAnimator.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject unexpected sources and prepare frontend-only artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          git ls-files --error-unmatch .nojekyll README.md app.js index.html .github/workflows/pages.yml >/dev/null
          test "$(git ls-files | wc -l)" -eq 5 || { echo "::error::Unsafe extra file in public Pages repository"; exit 1; }
          test -s index.html && test -s app.js
          if grep -nEi 'github_pat_|ghp_[A-Za-z0-9]{20}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ACCESS_TOKEN|SPINE_LICENSE_KEY|CLOUDFLARE_API_TOKEN' index.html app.js; then
            echo "::error::Potential private credentials in public Pages"; exit 1
          fi
          mkdir dist
          cp index.html app.js .nojekyll dist/
          test "$(find dist -type f | wc -l)" -eq 3
          echo 'PUBLIC_PAGES_ALLOWLIST_PASS'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published HTML and JavaScript over HTTPS
        shell: bash
        env:
          PUBLIC_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_PAGE_URL" || { echo '::error::Deployment returned no public URL'; exit 1; }
          case "$PUBLIC_PAGE_URL" in
            https://spineanimator.github.io/|https://spineanimator.github.io) ;;
            *) echo "::error::Unexpected Pages origin: $PUBLIC_PAGE_URL"; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 4 --retry-all-errors --max-time 15 \
            "https://spineanimator.github.io/" -o "$RUNNER_TEMP/published-index.html"
          grep -Fq 'SPINE ANIMATOR' "$RUNNER_TEMP/published-index.html"
          grep -Fq 'src="./app.js"' "$RUNNER_TEMP/published-index.html"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 4 --retry-all-errors --max-time 15 \
            "https://spineanimator.github.io/app.js" -o "$RUNNER_TEMP/published-app.js"
          node --check "$RUNNER_TEMP/published-app.js"
          grep -Fq 'Cloud animation in progress' "$RUNNER_TEMP/published-app.js"
          echo "LIVE_PAGES_HTML_AND_JS_PASS $PUBLIC_PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify cloud animation API preflights
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            "https://spine-studio.spine-animator-f8692224.workers.dev/api/plan" \
            "https://spine-generator.spine-animator-f8692224.workers.dev/api/build"; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 15 \
              --output /dev/null --dump-header "$headers" \
              --request OPTIONS \
              --header 'Origin: https://spineanimator.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --write-out '%{http_code}' "$endpoint")"
            if [[ "$status" != 200 && "$status" != 204 ]]; then
              echo "::error::API preflight HTTP $status for $endpoint"
              exit 1
            fi
            if ! grep -Fiq 'access-control-allow-origin: https://spineanimator.github.io' "$headers"; then
              echo "::error::Missing canonical Origin permission for $endpoint"
              exit 1
            fi
            echo "API_PREFLIGHT_PASS $endpoint" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$headers"
          done
