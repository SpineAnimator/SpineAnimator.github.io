            await page.evaluate(({png64})=>{
              const skel={skeleton:{spine:'4.3.26',width:124,height:64,images:'./images/'},
                bones:[{name:'root'},{name:'left',parent:'root',x:-30},{name:'right',parent:'root',x:30}],
