                  image_a:{partA:{type:'region',path:'part-a',width:48,height:48}},
                  image_b:{partB:{type:'region',path:'part-b',width:48,height:48}},
                  hotspot:{hotspot:{type:'region',path:'hotspot',width:8,height:8}}
                }}],animations:{idle:{}}};
              const jsonBytes=new TextEncoder().encode(JSON.stringify(skel));
              const encode=data=>{let v='';for(const b of data)v+=String.fromCharCode(b);return btoa(v);};
              const files={
                'skeleton.json':encode(jsonBytes),
                'images/part-a.png':png64,
                'images/part-b.png':png64,
                'images/hotspot.png':png64
              };
              const sent={};
              const fake={bytes:files,writes:sent,commits:0,original:JSON.stringify(skel),result:null};
              window.__testLocalBridge=fake;
              window.addEventListener('message',event=>{
                const m=event.data;
                if(event.source!==window||m?.channel!=='spine-mask-native-v1'||m.type!=='request')return;
                let response={channel:m.channel,type:'response',id:m.id,ok:true};
                try{
                  switch(m.method){
                    case 'ping':
                      if(fake.offline)throw Error('native host disconnected');
                      response.result={connected:true,protocol:'spinemask/1'};break;
                    case 'open_project':
                      response.result={open:true,connected:true,session:'test-session',
                        source:'scene.json',sourceType:'.json',
                        files:[
                          {key:'skeleton.json',name:'skeleton.json',size:jsonBytes.length},
                          {key:'images/part-a.png',name:'part-a.png',size:atob(png64).length},
                          {key:'images/part-b.png',name:'part-b.png',size:atob(png64).length},
                          {key:'images/hotspot.png',name:'hotspot.png',size:atob(png64).length}
                        ]};break;
                    case 'read_chunk':{
                      const decoded=atob(files[m.params.key]),offset=m.params.offset;
                      const chunk=decoded.slice(offset,offset+96000);
                      response.result={key:m.params.key,offset,total:decoded.length,
                        base64:btoa(chunk),done:offset+chunk.length>=decoded.length};break;
                    }
                    case 'begin_result':
                      fake.expected=m.params.files;
                      response.result={stage:'test-output',status:'receiving'};break;
                    case 'write_chunk':{
                      const n=m.params.name,p=m.params,prev=sent[n]||'';
                      if(p.offset!==prev.length)throw Error('Invalid write offset');
                      sent[n]=prev+atob(p.base64);
                      response.result={written:sent[n].length,name:n};break;
                    }
                    case 'commit_result':
                      fake.commits++;
                      fake.result=JSON.parse(sent['mask.json']);
                      response.result={saved:true,imported:true,opened:true,project:'scene-mask.spine'};break;
                    default:throw Error('Unexpected native call');
                  }
                }catch(error){response={...response,ok:false,error:String(error)};}
                queueMicrotask(()=>window.postMessage(response,location.origin));
              });
            },{png64});
            await page.locator('#open-editor').click();
            await page.waitForSelector('#selection-tree label.tree-row',{state:'attached',timeout:20000});
            await page.locator('#agent-toggle').click();
