            assert.equal(await page.locator('#quick-install-bridge').isHidden(),true,
              'Linux Bridge 1.4 can connect for weighted multi-slot save without macOS same-instance capability');
            console.log('MASK_LINUX_BRIDGE_CAPABILITY_HANDSHAKE_PASS');
            await page.evaluate(()=>{window.__testLocalBridge.offline=true;});
            await page.locator('#quick-from-spine').click();
            await page.waitForFunction(()=>window.__testLocalBridge.pings>=4&&document.getElementById('quick-install-bridge')?.hidden===false,
              null,{timeout:15000});
            assert.equal(await page.locator('#quick-install-bridge').isVisible(),true,
              'Installer must reappear after Bridge disconnect');
            assert.equal(await page.locator('#quick-install-bridge').textContent(),'Install Bridge / Extension');
            console.log('MASK_SIMPLE_BRIDGE_INSTALL_LIFECYCLE_PASS');
            assert.deepEqual(pageErrors,[]);
            console.log('MASK_TOOL_BROWSER_E2E_PASS', {url,singleVertices:clip.vertexCount,mergedSlots:merged.slots.length});
          } finally {await browser.close();}
          NODE
          node "$RUNNER_TEMP/mask-smoke/smoke.mjs"
      - name: Browser E2E — live PSD link, real PSD file upload, responsive composer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/main-psd-smoke"
          npm install --prefix "$RUNNER_TEMP/main-psd-smoke" --no-audit --no-fund --silent playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            "$RUNNER_TEMP/main-psd-smoke/node_modules/.bin/playwright" install chromium
          fi
          export CHROME_PATH
          cat > "$RUNNER_TEMP/main-psd-smoke/smoke.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { chromium } from 'playwright';

          const diagnosticLog=[];
          const record=(label,data={})=>{
            const entry={at:new Date().toISOString(),label,...data};
            diagnosticLog.push(entry);
            console.log('PSD_E2E_DIAGNOSTIC',JSON.stringify(entry));
          };

          const origin='https://spineanimator.github.io';
          const approved='https://files.catbox.moe/clgb71.psd';
          const sourceApi='https://spine-generator.spine-animator-f8692224.workers.dev/api/psd-source';
          const expected={bytes:4485543,sha256:'7adee866547a3b3cc9838b655cf70865980c5dba00313373cbf903fed776c7b2'};
          const sourceResponse=await fetch(sourceApi+'?url='+encodeURIComponent(approved),{
            headers:{origin},redirect:'error',signal:AbortSignal.timeout(25000)
          });
          assert.equal(sourceResponse.status,200,'approved real PSD must be available from production source API');
          const psd=Buffer.from(await sourceResponse.arrayBuffer());
          assert.equal(psd.length,expected.bytes,'production PSD size mismatch');
          assert.equal(createHash('sha256').update(psd).digest('hex'),expected.sha256,'production PSD digest mismatch');
          assert.deepEqual([...psd.subarray(0,6)],[0x38,0x42,0x50,0x53,0,1],'invalid real PSD header');

          const opts={headless:true,args:['--no-sandbox','--disable-dev-shm-usage']};
          if(process.env.CHROME_PATH)opts.executablePath=process.env.CHROME_PATH;
          const browser=await chromium.launch(opts);
          const errors=[];
          const consoleMessages=[];
          const failedRequests=[];
          const appResponses=[];
          const sourceRequests=[];
          const planRequests=[];
          async function newPage(){
            const page=await browser.newPage({viewport:{width:375,height:820}});
            const navigations=[];
            await page.addInitScript(()=>{
              window.__saEventLog=[];
              const log=(where,event)=>window.__saEventLog.push(where+':'+event.type+':'+
                (event.target?.tagName||'')+'#'+(event.target?.id||''));
              const original=EventTarget.prototype.addEventListener;
              EventTarget.prototype.addEventListener=function(type,listener,options){
                if(type==='click'&&this&&this.id==='generate'){
                  const name=listener?.name||'anonymous';
                  window.__saEventLog.push('listener-added:'+type+':'+name);
                  if(typeof listener==='function'){
                    const wrapped=function(event){log('button-handler:'+name,event);return listener.call(this,event);};
                    return original.call(this,type,wrapped,options);
                  }
                }
                return original.call(this,type,listener,options);
              };
              for(const type of ['pointerdown','pointerup','mousedown','mouseup','click']){
                window.addEventListener(type,event=>log('window',event),true);
                document.addEventListener(type,event=>log('document',event),true);
              }
              const observer=new MutationObserver(()=>{
                const button=document.getElementById('generate');
                if(button&&!button.dataset.saProbe){
                  button.dataset.saProbe='1';
                  button.addEventListener('click',event=>log('button-probe',event),true);
                }
              });
              observer.observe(document,{childList:true,subtree:true});
            });
            page.on('framenavigated',frame=>navigations.push(frame.url()));
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>consoleMessages.push(m.type()+': '+m.text()));
            page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{const path=new URL(r.url()).pathname;if(path.endsWith('/app.js')||path.endsWith('/bundle.js'))appResponses.push({url:r.url(),status:r.status()});});
            page.on('request',r=>{
              if(r.url().includes('/api/psd-source'))sourceRequests.push(r.url());
              if(r.method()==='POST'&&r.url().endsWith('/api/plan'))planRequests.push(r.postDataJSON());
            });
            await page.route('https://spine-studio.spine-animator-f8692224.workers.dev/**',async route=>{
              const req=route.request();
              const cors={'Access-Control-Allow-Origin':origin,'Access-Control-Allow-Methods':'POST,OPTIONS',
                'Access-Control-Allow-Headers':'content-type'};
              if(req.method()==='OPTIONS'){await route.fulfill({status:204,headers:cors});return;}
              assert.equal(new URL(req.url()).pathname,'/api/plan');
              await route.fulfill({status:200,headers:{...cors,'Content-Type':'application/json'},
                body:JSON.stringify({scene:{clips:[{id:'smoke-idle',duration:1,tracks:[]}]},
                  validation:{initialPosePreserved:true,drawOrderPreserved:true}})});
            });
            await page.route('https://spine-generator.spine-animator-f8692224.workers.dev/api/build',async route=>{
              const cors={'Access-Control-Allow-Origin':origin,'Access-Control-Allow-Methods':'POST,OPTIONS',
                'Access-Control-Allow-Headers':'content-type'};
              if(route.request().method()==='OPTIONS'){await route.fulfill({status:204,headers:cors});return;}
              await route.fulfill({status:200,headers:{...cors,'Content-Type':'application/zip'},
                body:Buffer.from([0x50,0x4b,0x03,0x04,0x00,0x00,0x00,0x00])});
            });
            const response=await page.goto(origin+'/?psd-ui-smoke='+Date.now(),{waitUntil:'load',timeout:45000});
            assert.equal(response.status(),200,'public website must return HTTP 200');
            record('page-loaded',{url:page.url(),httpStatus:response.status()});
            await page.waitForFunction(()=>!!window.agPsd?.readPsd,{timeout:30000}).catch(async error=>{
              const diag=await page.evaluate(()=>({
                readyState:document.readyState,
                agPsd:typeof window.agPsd,
                scripts:[...document.scripts].map(s=>({src:s.src,type:s.type,ready:s.readyState})),
                generateExists:!!document.getElementById('generate'),
                status:document.getElementById('status')?.textContent||''
              }));
              record('ag-psd-startup-timeout',{diag,pageErrors:errors,console:consoleMessages,failedRequests});
              throw new Error('ag-psd did not initialize: '+JSON.stringify(diag)+'; pageErrors='+JSON.stringify(errors)+'; console='+JSON.stringify(consoleMessages)+'; failedRequests='+JSON.stringify(failedRequests)+'; cause='+error.message);
            });
            record('ag-psd-ready');
            const startup=await page.evaluate(()=>({
              events:window.__saEventLog||[],
              scripts:[...document.scripts].map(s=>s.src),
              generateExists:!!document.getElementById('generate'),
              generateDisabled:!!document.getElementById('generate')?.disabled
            }));
            console.log('PSD_E2E_BROWSER_STARTUP',JSON.stringify({startup,appResponses}));
            if(!startup.events.some(x=>x.startsWith('listener-added:click:')))
              throw new Error('app.js did not register the Animate click handler; startup='+
                JSON.stringify(startup)+'; appResponses='+JSON.stringify(appResponses)+
                '; console='+JSON.stringify(consoleMessages)+'; pageErrors='+JSON.stringify(errors));
            return page;
          }
          async function checkLayout(page){
            for(const width of [375,768,1280]){
              await page.setViewportSize({width,height:820});
              const result=await page.evaluate(()=>{
                const ids=['source-url','file-drop','generate'];
                const rects=ids.map(id=>document.getElementById(id).getBoundingClientRect());
                const group=document.querySelector('.url-row.chat-source-actions').getBoundingClientRect();
                return {tops:rects.map(r=>r.top),lefts:rects.map(r=>r.left),rights:rects.map(r=>r.right),
                  groupRight:group.right,groupLeft:group.left,labels:[
                    document.getElementById('source-url').placeholder,
                    document.querySelector('#file-drop span').textContent.trim(),
                    document.querySelector('#generate span').textContent.trim()]};
              });
              assert.deepEqual(result.labels,['Paste link','Add PSD','Animate']);
              assert.ok(Math.max(...result.tops)-Math.min(...result.tops)<2,'composer controls wrapped at '+width+'px');
              assert.ok(result.lefts[0]<result.lefts[1]&&result.lefts[1]<result.lefts[2],
                'composer control order changed at '+width+'px');
              assert.ok(result.rights[2]<=result.groupRight+1,'Animate overflows composer at '+width+'px');
              assert.ok(result.rights[0]<=result.lefts[1],'link overlaps Add PSD at '+width+'px');
            }
          }
          async function runSource(page,mode){
            await page.locator('#prompt').fill('Preserve the source pose and create a short idle animation');
            if(mode==='link'){
              await page.locator('#source-url').fill(approved);
              await page.locator('#source-url').dispatchEvent('change');
            }else{
              await page.locator('#source-file').setInputFiles({
                name:'clgb71.psd',mimeType:'image/vnd.adobe.photoshop',buffer:psd
              });
            }
            console.log('PSD_E2E_' + mode.toUpperCase() + '_START');
            await page.locator('#generate').click();
            const clickDiagnostic=await page.evaluate(()=> {
              const button=document.getElementById('generate');
              const rect=button?.getBoundingClientRect();
              const hit=rect?document.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2):null;
              const style=button?getComputedStyle(button):null;
              return {
                events:window.__saEventLog||[],
                status:document.getElementById('status')?.textContent||'',
                disabled:!!button?.disabled,
                url:location.href,
                rect:rect?{x:rect.x,y:rect.y,width:rect.width,height:rect.height}:null,
                hit:hit?{tag:hit.tagName,id:hit.id,className:String(hit.className||'')}:null,
                style:style?{display:style.display,visibility:style.visibility,pointerEvents:style.pointerEvents}:null,
                buttons:document.querySelectorAll('#generate').length
              };
            });
            console.log('PSD_E2E_' + mode.toUpperCase() + '_CLICK',JSON.stringify(clickDiagnostic));
            if(!clickDiagnostic.events.some(x=>x.includes('button-handler:create')||x.includes('button-probe:click')))
              throw new Error(mode+' Animate click did not reach the button handler; diagnostic='+JSON.stringify(clickDiagnostic)+
                '; navigations='+JSON.stringify(navigations)+'; appResponses='+JSON.stringify(appResponses)+
                '; console='+JSON.stringify(consoleMessages)+'; failedRequests='+JSON.stringify(failedRequests));
            if(!clickDiagnostic.status && !clickDiagnostic.disabled)
              throw new Error(mode+' Animate handler appears not to have started; diagnostic='+JSON.stringify(clickDiagnostic)+
                '; appResponses='+JSON.stringify(appResponses)+'; console='+JSON.stringify(consoleMessages)+
                '; failedRequests='+JSON.stringify(failedRequests));
            await page.waitForFunction(()=>{
              const status=document.getElementById('status')?.textContent || '';
              return status.includes('ZIP ready') || status.includes('Generation failed [');
            },null,{timeout:90000}).catch(async error=>{
              const diagnostic=await page.evaluate(()=>({
                status:document.getElementById('status')?.textContent || '',
                layers:document.getElementById('layer-count')?.textContent || '',
                dimensions:document.getElementById('source-size')?.textContent || '',
                sourceName:document.getElementById('source-name')?.textContent || '',
                previewVisible:!!document.getElementById('source-preview') && !document.getElementById('source-preview').hidden
              }));
              throw new Error(mode + ' PSD flow timed out; diagnostic=' + JSON.stringify(diagnostic) +
                '; browserErrors=' + JSON.stringify(errors) + '; sourceRequests=' +
                JSON.stringify(sourceRequests) + '; appResponses=' + JSON.stringify(appResponses) +
                '; console=' + JSON.stringify(consoleMessages) + '; failedRequests=' +
                JSON.stringify(failedRequests) + '; cause=' + error.message);
            });
            const state=await page.evaluate(()=>({
              layers:Number(document.getElementById('layer-count').textContent),
              dimensions:document.getElementById('source-size').textContent,
              sourceName:document.getElementById('source-name').textContent,
              previewVisible:!document.getElementById('source-preview').hidden,
              downloadVisible:!document.getElementById('download').hidden,
              status:document.getElementById('status').textContent
            }));
            if(!state.status.includes('ZIP ready'))
              throw new Error(mode + ' PSD flow failed before planner/export: ' + state.status);
            assert.ok(state.layers>0,mode+' PSD parsed without visible layers');
            assert.match(state.dimensions,/\d+ × \d+/);
            assert.equal(state.previewVisible,true,mode+' PSD preview missing');
            assert.equal(state.downloadVisible,true,mode+' did not reach ZIP export');
            assert.match(state.status,/ZIP ready/);
            assert.equal(planRequests.length>=1,true,mode+' did not reach planner');
            const plan=planRequests.at(-1);
            assert.ok(Array.isArray(plan.layers)&&plan.layers.length===state.layers,
              mode+' planner payload did not preserve parsed layer list');
            assert.equal(plan.validation,undefined,'validation must be produced by the planner, not client');
            return state;
          }
          try{
            record('layout-start');
            const layoutPage=await newPage();
            await checkLayout(layoutPage);
            record('layout-pass');
            await layoutPage.close();

            record('link-flow-start');
            const linkPage=await newPage();
            const link=await runSource(linkPage,'link');
            record('link-flow-pass',{layers:link.layers,dimensions:link.dimensions,status:link.status});
            assert.ok(sourceRequests.some(url=>decodeURIComponent(url).includes('clgb71.psd')),
              'link mode did not request the approved PSD source through the production source API');
            await linkPage.close();

            record('file-flow-start');
            const filePage=await newPage();
            const before=sourceRequests.length;
            const file=await runSource(filePage,'file');
            record('file-flow-pass',{layers:file.layers,dimensions:file.dimensions,status:file.status});
            assert.equal(sourceRequests.length,before,'local file upload unexpectedly used remote URL source API');
            assert.equal(file.sourceName,'clgb71.psd');
            await filePage.close();

            assert.deepEqual(errors,[],'browser runtime errors occurred');
            console.log('MAIN_COMPOSER_RESPONSIVE_ONE_ROW_PASS');
            console.log('REAL_PSD_LINK_TO_PLANNER_AND_ZIP_PASS',link);
            console.log('REAL_PSD_FILE_UPLOAD_TO_PLANNER_AND_ZIP_PASS',file);
          }catch(error){
            record('fatal',{message:error?.message||String(error),stack:error?.stack||'',pageErrors:errors,
              console:consoleMessages,failedRequests,appResponses,sourceRequests,planRequests});
            writeFileSync(process.env.RUNNER_TEMP+'/main-psd-smoke/diagnostics.json',
              JSON.stringify(diagnosticLog,null,2));
            throw error;
          }finally{await browser.close();}
          NODE
          node --check "$RUNNER_TEMP/main-psd-smoke/smoke.mjs"
          export CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          node "$RUNNER_TEMP/main-psd-smoke/smoke.mjs"
      - name: Upload PSD browser E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-psd-browser-e2e-diagnostics
          path: ${{ runner.temp }}/main-psd-smoke/diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify cloud animation API preflights
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            "https://spine-studio.spine-animator-f8692224.workers.dev/api/plan" \
            "https://spine-generator.spine-animator-f8692224.workers.dev/api/build"; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 15 \
              --output /dev/null --dump-header "$headers" \
              --request OPTIONS \
              --header 'Origin: https://spineanimator.github.io' \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --write-out '%{http_code}' "$endpoint")"
            if [[ "$status" != 200 && "$status" != 204 ]]; then
              echo "::error::API preflight HTTP $status for $endpoint"
              exit 1
            fi
            if ! grep -Fiq 'access-control-allow-origin: https://spineanimator.github.io' "$headers"; then
              echo "::error::Missing canonical Origin permission for $endpoint"
              exit 1
            fi
            echo "API_PREFLIGHT_PASS $endpoint" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$headers"
          done
