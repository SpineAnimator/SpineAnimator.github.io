name: Spine Mask Tool tests

on:
  push:
    paths:
      - "Spine-Mask-Tool/**"
      - ".github/workflows/spine-mask-tool-tests.yml"
  pull_request:
    paths:
      - "Spine-Mask-Tool/**"
      - ".github/workflows/spine-mask-tool-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module --test Spine-Mask-Tool/tests/*.test.mjs
